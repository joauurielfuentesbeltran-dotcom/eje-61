
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Tecnológico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header class="bg-dark text-white py-4">
        <div class="container">
            <h1 class="display-6 fw-bold">Catálogo Tecnológico</h1>
        </div>
    </header>
    <main class="container py-5">
        <div class="row g-3">
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <span class="badge bg-success">En Stock</span>
                        <h2 class="h5 mt-3">Mouse RGB 16k</h2>
                        <p class="text-success fw-bold fs-4">$45.00</p>
                        <button class="btn btn-primary w-100">Comprar</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <span class="badge bg-success">En Stock</span>
                        <h2 class="h5 mt-3">Teclado Mecánico</h2>
                        <p class="text-success fw-bold fs-4">$85.00</p>
                        <button class="btn btn-primary w-100">Comprar</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <span class="badge bg-warning text-dark">
                            Pocas Unidades
                        </span>
                        <h2 class="h5 mt-3">Audífonos 7.1</h2>
                        <p class="text-success fw-bold fs-4">$65.00</p>
                        <button class="btn btn-primary w-100">Comprar</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <span class="badge bg-danger">Agotado</span>
                        <h2 class="h5 mt-3">Monitor 240Hz</h2>
                        <p class="text-success fw-bold fs-4">$299.00</p>
                        <button class="btn btn-secondary w-100" disabled>
                            Sin Stock
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
